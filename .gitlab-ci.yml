# Этапы пайплайна
stages:
  - test
  - build
  - deploy

# Глобальные переменные (с дефолтными значениями-подстраховкой)
variables:
  DOCKER_DRIVER: overlay2
  
  # Основные переменные для БД и приложения
  DB_NAME: test
  DB_USER: fredbrit
  DB_PASS: $DB_PASS 
  
  DB_HOST: postgres
  DB_PORT: 5432
  REDIS_HOST: redis
  REDIS_PORT: 6379
  MODE: TEST
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: 30
  TEST_JWT_SECRET: $TEST_JWT_SECRET

# ========================
# 1. ТЕСТЫ
# ========================
test:
  stage: test
  image: python:3.11-slim
  services:
    - name: postgres:16
      alias: postgres
      variables:
        POSTGRES_DB: $DB_NAME
        POSTGRES_USER: $DB_USER
        POSTGRES_PASSWORD: $DB_PASS
    - name: redis:7.4
      alias: redis
  variables:
    # Пробрасываем переменные окружения для твоего Python-приложения
    MODE: $MODE
    DB_HOST: $DB_HOST
    DB_PORT: $DB_PORT
    DB_NAME: $DB_NAME
    DB_USER: $DB_USER
    DB_PASS: $DB_PASS
    REDIS_HOST: $REDIS_HOST
    REDIS_PORT: $REDIS_PORT
    JWT_SECRET_KEY: $TEST_JWT_SECRET
    JWT_ALGORITHM: $JWT_ALGORITHM
    ACCESS_TOKEN_EXPIRE_MINUTES: $ACCESS_TOKEN_EXPIRE_MINUTES
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
  script:
    - pytest tests/ -v --cov=src --cov-report=xml
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ========================
# 2. СБОРКА DOCKER-ОБРАЗА
# ========================
build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Собираем образ с тегом коммита
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    # Пушим образ с тегом коммита
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    # Тагаем как latest и пушим
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ========================
# 3. ДЕПЛОЙ НА СЕРВЕР
# ========================
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    # Добавляем SSH ключ
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    # Создаем папку для known_hosts
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Добавляем сервер в доверенные (чтобы не спрашивал подтверждение)
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null
  script:
    # Подключаемся к серверу и выполняем команды
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "
        set -e
        cd /opt/booking
        
        # Скачиваем свежий образ
        echo 'Pulling latest image...'
        docker pull $CI_REGISTRY_IMAGE:latest
        
        # Останавливаем старые контейнеры
        echo 'Stopping old containers...'
        docker compose down || true
        
        # Запускаем новые контейнеры
        echo 'Starting new containers...'
        docker compose up -d
        
        # Чистим старые образы (опционально)
        echo 'Cleaning up old images...'
        docker image prune -f
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual  # Деплой запускается вручную кнопкой Play
  environment:
    name: production
    url: http://$DEPLOY_HOST:7777
